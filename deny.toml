# cargo-deny configuration.
#
# The core promise of this project is that a user's files never leave their
# machine. This file turns that promise into an enforced build rule: if any
# dependency (now or in the future) pulls in code capable of opening a network
# connection, `cargo deny check bans` fails. "Never goes online" stops being a
# claim and becomes something CI verifies.

# Only analyze the desktop platforms we actually ship. (Tauri declares a
# mobile-only `reqwest` dependency under cfg(android/ios); since we do not ship
# mobile, it never enters our binary and must not be analyzed.)
[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Philosophy: ban every crate that can actually OPEN a network connection.
#
# The linchpin is `socket2` + `mio` — Rust's raw socket primitives. With neither
# present, nothing (not even tokio) can open a TCP/UDP socket, so any future
# change that adds real network capability necessarily pulls one of them in and
# trips this check. We deliberately do NOT ban `http` (HTTP *types* only, no I/O,
# used by Tauri's local IPC) or `tokio` (async runtime; harmless without its net
# feature, which would require socket2/mio anyway).
deny = [
    # HTTP / network clients
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "hyper-tls" },
    { name = "hyper-rustls" },
    { name = "h2" },
    { name = "ureq" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    # TLS stacks (outbound HTTPS)
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "rustls" },
    # websockets / RPC / QUIC / DNS
    { name = "tungstenite" },
    { name = "tokio-tungstenite" },
    { name = "tonic" },
    { name = "quinn" },
    { name = "trust-dns-resolver" },
    { name = "hickory-resolver" },
    # alternate async runtimes that always bundle networking
    { name = "async-std" },
    { name = "smol" },
    # *** the tripwire: raw socket primitives ***
    { name = "socket2" },
    { name = "mio" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Free/libre app: permissive + GPL-compatible only.
allow = [
    "GPL-3.0",
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
# NOTE: anything not in `allow` above is denied automatically. AGPL is
# therefore blocked (it is intentionally absent), which keeps Ghostscript/MuPDF
# and other copyleft-incompatible engines out of the tree.
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
