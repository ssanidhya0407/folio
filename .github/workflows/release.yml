name: Release

# Tag a release to produce the three artifacts folio ships:
#   folio_<version>_x64_en-US.msi   direct download / winget
#   folio_<version>_x64-setup.exe   direct download (NSIS)
#   folio-<version>.msix            Microsoft Store submission
#
#     git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Generate icons and Store assets
        run: python assets/make-icons.py

      # GitHub runners are already elevated, so the Tesseract installer — which
      # demands admin and therefore cannot run unattended on a dev machine —
      # installs cleanly here.
      - name: Fetch native engines
        run: python assets/fetch-runtime.py --lang eng --tesseract

      - name: Test
        run: cargo test --workspace

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build installers (.msi / NSIS)
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Build Store package (.msix)
        shell: pwsh
        run: ./msix/build-msix.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: folio-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/msix/*.msix
          if-no-files-found: error

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          # The .msix is deliberately not attached: it is uploaded to Partner
          # Center unsigned, and publishing it here would invite people to
          # sideload a package Windows will refuse to install.
          fail_on_unmatched_files: true
